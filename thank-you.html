<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | Demilade Creatives</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<main class="thank-you-section">
  <div class="container">
    <div class="thank-you-card text-center">
      <div class="thank-you-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <p class="section-eyebrow mb-2">Message Received</p>
      <h1 class="section-title mb-3">Thank You!</h1>

      <p class="thank-you-message mx-auto">
        Your message has been received. I will respond within 1–2 business days.
      </p>

      <a href="/index.html" class="btn thank-you-btn mt-4">Return Home</a>
    </div>
  </div>
</main>

<script src="js/main.js"></script>
</body>
</html>
