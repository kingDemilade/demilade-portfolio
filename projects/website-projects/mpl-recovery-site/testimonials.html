<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/media.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <!-- ================= NAVIGATION ================= -->
  <header>
    <nav class="navbar">
      <div class="container nav-wrapper">

        <!-- Logo -->
      <a href="index.html">
        <div class="logo">
          <img src="images/logos/02-horizontal_mpl-recovery-logo.svg" alt="MPL Recovery Logo">
        </div>
      </a>

        <!-- Nav Links -->
        <ul class="nav-links" id="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="#">Videos</a></li>
          <li><a href="testimonials.html" class="active">Testimonials</a></li>
          <li><a href="book.html" class="btn-secondary">Book Now</a></li>
        </ul>

        <!-- Dark Mode Toggle -->
<button class="theme-toggle desktop-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  <span class="icon-moon">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M21.75 15.5A9 9 0 1112.5 2.25a7 7 0 109.25 13.25z"/>
    </svg>
  </span>

  <span class="icon-sun">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="12" cy="12" r="5"/>
      <g stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="4"/>
        <line x1="12" y1="20" x2="12" y2="23"/>

        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
      </g>
    </svg>
  </span>
</button>

<!-- Mobile Controls -->
<div class="mobile-controls">

  <!-- Dark Mode Toggle -->
  <button class="theme-toggle mobile-theme-toggle" id="mobile-theme-toggle" aria-label="Toggle dark mode">
    <span class="icon-moon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21.75 15.5A9 9 0 1112.5 2.25a7 7 0 109.25 13.25z"/>
      </svg>
    </span>

    <span class="icon-sun">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="12" cy="12" r="5"/>
        <g stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
          <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="4" y2="12"/>
          <line x1="20" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
          <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </g>
      </svg>
    </span>
  </button>

  <!-- Hamburger -->
  <div class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>

      </div>
    </nav>
  </header>

  <!-- ================= HERO ================= -->
  <section class="interior-hero testimonials-hero image-slot" data-image-slot="Upload: images/hero/testimonials-hero.jpg">
    <img class="slot-image" src="images/hero/testimonials-hero.jpg" alt="" onload="this.closest('.image-slot').classList.add('has-image')" onerror="this.hidden=true">
    <div class="interior-hero-overlay"></div>
    <div class="container interior-hero-content">

      <div class="interior-hero-text">
        <h1>
          <span>Testimonials</span>
        </h1>

        <p>
          Real experiences from athletes, coaches, parents, and event leaders.
        </p>
      </div>

    </div>
  </section>

  <!-- ================= TESTIMONIALS PAGE ================= -->
  <main class="testimonials-page">
    <section class="testimonials-section section-padding">
      <div class="container">

        <div class="testimonial-actions reveal">
          <div class="testimonial-filter">
            <button class="active" type="button" data-testimonial-filter="all">All Stories</button>
            <button type="button" data-testimonial-filter="athlete">Athletes</button>
            <button type="button" data-testimonial-filter="coach">Coaches</button>
            <button type="button" data-testimonial-filter="parent">Parents</button>
            <button type="button" data-testimonial-filter="director">Directors</button>
          </div>

          <a href="survey.html" class="btn-primary testimonial-share-btn">Share Your Experience</a>
        </div>

        <div class="testimonial-list" id="testimonial-list">
        </div>

      </div>
    </section>

    <section class="testimonials-cta image-slot" data-image-slot="Upload: images/testimonials/testimonials-cta.jpg">
      <img class="slot-image" src="images/testimonials/testimonials-cta.jpg" alt="" onload="this.closest('.image-slot').classList.add('has-image')" onerror="this.hidden=true">
      <div class="container testimonials-cta-content reveal">
        <h2>Ready To Work Together?</h2>
        <p>Let's bring elite care to your next event.</p>
        <div class="testimonial-cta-buttons">
          <a href="book.html" class="btn-primary">Book Now</a>
          <a href="survey.html" class="btn-secondary">Leave A Review</a>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= FOOTER ================= -->
  <footer>
    <div class="container footer-content">
      <p>© 2026 MPL Recovery</p>
    </div>
  </footer>

  <!-- JS -->
  <script src="js/testimonials-config.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/testimonials.js" defer></script>

</body>
</html>
