<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lola Cooks | Coming Soon</title>
    <meta
      name="description"
      content="LolaCooks is launching soon with meal prep and nutrition support built for real-life consistency."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/projects/website-projects/lola-cooks/css/lola-cooks.css" />

    <!-- favicon link -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="coming-soon-page">
    <header class="site-header">
      <div class="container header-inner">
        <h1 class="site-logo">
          <a href="coming-soon.html" aria-label="LolaCooks home">
            <img
              src="images/logo/horizontal_lola-cooks-logo.svg"
              alt="LolaCooks"
              class="site-logo-img"
            />
          </a>
        </h1>

<!--     <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
          <a href="#preview">Coming Soon</a>
          <a href="#why-lola-cooks">About LolaCooks</a>
          <a href="#cta">Get Updates</a>
        </nav> -->

        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Switch to dark mode"
          title="Serve dark mode"
        >
          <span class="theme-toggle__plate" aria-hidden="true">
            <i class="fa-solid fa-sun theme-toggle__sun"></i>
            <i class="fa-solid fa-moon theme-toggle__moon"></i>
          </span>
          <span class="visually-hidden theme-toggle__label">Switch to dark mode</span>
        </button>

        <button
          id="menu-toggle"
          class="menu-toggle"
          type="button"
          aria-controls="primary-nav"
          aria-expanded="false"
          aria-label="Open navigation menu"
        >
          <i class="fa-solid fa-bars menu-toggle__open" aria-hidden="true"></i>
          <i class="fa-solid fa-xmark menu-toggle__close" aria-hidden="true"></i>
          <span class="visually-hidden menu-toggle__label">Open navigation menu</span>
        </button>
      </div>
    </header>

    <main>
      <section id="hero" class="hero-section coming-soon-hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
          <div class="hero-logo">
            <img
              src="images/logo/tall_lola-cooks-logo.svg"
              alt="Lola Cooks Logo"
              class="hero-logo-img"
            />
          </div>
          <h2>LolaCooks is almost ready to serve.</h2>
          <p class="hero-subtext">
            A new home for prepared meals, nutrition support, and real-life
            consistency is on the way. Until then, follow along for menus,
            updates, and availability.
          </p>
          <div class="coming-soon-actions">
            <a
              href="https://instagram.com/lolacookss"
              class="button-primary pulse button-pop"
              target="_blank"
              rel="noopener noreferrer"
            >
              Follow @lolacookss <span class="arrow">→</span>
            </a>
<!--            <a href="#preview" class="button-secondary">
              See What’s Coming <span aria-hidden="true">↓</span>
            </a> -->
          </div>
        </div>
      </section>

    </main>

    <footer id="cta" class="cta-section coming-soon-cta">
      <div class="container cta-content">
<p class="cta-note">© 2026 LolaCooks. All rights reserved.</p>
      </div>
    </footer>

    <button class="scroll-top" type="button" aria-label="Scroll to the top" title="Back to top">
      <i class="fa-solid fa-chevron-up" aria-hidden="true"></i>
    </button>

    <script src="/projects/website-projects/lola-cooks/js/lola-cooks.js"></script>
  </body>
</html>
