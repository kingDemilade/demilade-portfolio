<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PBC Redesign Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ALERT BAR -->
  <div class="alert-bar">
    ⚠ Hurricane Preparedness Update: Stay informed.
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">PBC.gov</div>
    <nav>
      <a href="#">Services</a>
      <a href="#">Departments</a>
      <a href="#">Residents</a>
      <a href="#">Business</a>
    </nav>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>How can we help you today?</h1>
    <input type="text" placeholder="Search for services..." />
    <div class="quick-actions">
      <button>Pay Bill</button>
      <button>Report Issue</button>
      <button>Apply</button>
      <button>Find Services</button>
    </div>
  </section>

  <!-- SERVICES GRID -->
  <section class="services">
    <h2>Popular Services</h2>
    <div class="grid">
      <div class="card">Garbage & Recycling</div>
      <div class="card">Property Taxes</div>
      <div class="card">Permits</div>
      <div class="card">Parks & Rec</div>
    </div>
  </section>

  <!-- NEWS -->
  <section class="news">
    <h2>News & Updates</h2>
    <div class="grid">
      <div class="card">County Budget Approved</div>
      <div class="card">Road Closures This Week</div>
      <div class="card">Community Event</div>
    </div>
  </section>

</body>
</html>
